name: template firmware

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/commands/init/**"
      - "src/commands/new.rs"
      - "src/codegen/**"
      - "tests/new_firmware.rs"
      - ".github/workflows/templates.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, thumbv6m-none-eabi

      - name: Install the esp toolchain
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          default: false
          override: false
          ldproxy: false
          buildtargets: esp32s3

      - name: Build every template firmware for its target
        run: cargo test --locked --test new_firmware -- --ignored
