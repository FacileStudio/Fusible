name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --no-fail-fast

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: oven-sh/setup-bun@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --no-fail-fast
        env:
          FUSIBLE_REQUIRE_BUN: "1"

      - name: Build the release binary
        run: cargo build --release --locked

      - name: Name the gerbv cache
        id: gerbv-cache
        run: echo "key=gerbv-$ImageOS-$(uname -m)-v1" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/gerbv-debs
          key: ${{ steps.gerbv-cache.outputs.key }}

      - name: Install gerbv
        timeout-minutes: 15
        run: |
          debs="$HOME/gerbv-debs"
          if compgen -G "$debs/*.deb" > /dev/null && sudo dpkg -i "$debs"/*.deb; then exit 0; fi
          mkdir -p "$debs/partial"
          apt_get() {
            sudo timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              -o Dir::Cache::Archives="$debs" -o APT::Keep-Downloaded-Packages=true "$@"
          }
          install() { apt_get update && apt_get install -y -f --no-install-recommends gerbv; }
          install || { sleep 15; install; }
          sudo rm -rf "$debs/partial" "$debs/lock"
          sudo chown -R "$USER" "$debs"

      - name: Render Gerber layers in gerbv
        run: |
          set -euo pipefail
          rm -rf viewer-out
          mkdir -p viewer-out
          rendered=0
          while IFS= read -r board; do
            name=$(basename "$board" .json)
            ./target/release/fusible export "$board" --preset fab -o "viewer-out/$name" --skip-lint
            mkdir -p "viewer-out/$name/layers"
            unzip -q "viewer-out/$name/gerbers.zip" -d "viewer-out/$name/layers"
            required="Edge_Cuts.gbr"
            if grep -q '"pcb_hole"' "$board"; then required="$required drill_npth.drl"; fi
            if grep -qE '"pcb_(via|plated_hole)"' "$board"; then required="$required drill_pth.drl"; fi
            for file in $required; do
              layer="viewer-out/$name/layers/$file"
              if [ ! -f "$layer" ] || { ! grep -q "^%ADD" "$layer" && ! grep -q "^T[0-9]*C" "$layer"; }; then
                echo "$name: $file is missing or empty"
                exit 1
              fi
            done
            for layer in "viewer-out/$name/layers"/*; do
              out="viewer-out/$name-$(basename "$layer").png"
              if ! grep -q "^%ADD" "$layer" && ! grep -q "^T[0-9]*C" "$layer"; then continue; fi
              status=0
              gerbv -x png -w 1600x1200 -o "$out" "$layer" > "$out.log" 2>&1 || status=$?
              unexpected=$(grep -vE 'Unknown RS-274X extension found %T[FAD]%|^$' "$out.log" || true)
              if [ "$status" -ne 0 ] || [ -n "$unexpected" ] || [ ! -s "$out" ]; then
                echo "gerbv rejected $layer (exit $status)"
                cat "$out.log"
                exit 1
              fi
              rendered=$((rendered + 1))
            done
          done < <(grep -l '"pcb_board"' examples/*.json)
          if [ "$rendered" -eq 0 ]; then
            echo "no Gerber layer was rendered"
            exit 1
          fi

      - name: Upload Gerber renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gerber-renders
          path: viewer-out/*.png
          if-no-files-found: warn

      - name: Rule docs match the registry
        run: bun scripts/rules-doc.ts --check
        env:
          FUSIBLE_BIN: ./target/release/fusible
