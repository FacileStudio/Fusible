<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fusible Studio</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <script>
    try {
      var stored = localStorage.getItem("fusible-theme");
      var light = stored === "light" || (stored === "system" && matchMedia("(prefers-color-scheme: light)").matches);
      document.documentElement.className = light ? "light" : "dark";
    } catch (e) {
      document.documentElement.className = "dark";
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
