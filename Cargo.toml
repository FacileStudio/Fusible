[package]
name = "fusible"
version = "1.1.2"
edition = "2021"
description = "Electronic linter: a fuse that blows to block firmware code generation"
license = "MIT"
repository = "https://github.com/FacileStudio/Fusible"
homepage = "https://fusible.facile.studio"
documentation = "https://fusible.facile.studio/docs"
readme = "README.md"
keywords = ["eda", "hardware", "kicad", "tscircuit", "linter"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**/*", "/tests/**/*", "/examples/**/*", "/studio/src/**/*", "/studio/package.json", "/studio/bun.lock", "/build.rs", "/assets/favicon.svg", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[dependencies]
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
miette = { version = "7", features = ["fancy"] }
notify-debouncer-mini = "0.7.0"
rstar = "0.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tiny_http = "0.12.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
